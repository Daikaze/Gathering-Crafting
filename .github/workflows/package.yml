name: Package module
on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed item artwork before packaging
        run: node artwork/check_preview_payload.cjs
      - name: Audit all item artwork and module regression tests
        run: |
          node tests/artwork.cjs
          node tests/smoke.cjs
          node --test tests/tool-rules.test.mjs tests/enchanting.test.mjs
          node artwork/check_preview_payload.cjs
      - name: Package Foundry module
        run: |
          VERSION="$(node -p "require('./module.json').version")"
          mkdir -p dist staging/gathering-crafting
          rsync -a --exclude=.git --exclude=.github --exclude=dist --exclude=staging --exclude=illustrated-assets --exclude=artwork --exclude=artwork-backups ./ staging/gathering-crafting/
          (cd staging && zip -q -r "../dist/gathering-crafting-v${VERSION}.zip" gathering-crafting)
      - name: Validate installable archive
        run: |
          VERSION="$(node -p "require('./module.json').version")"
          ARCHIVE="dist/gathering-crafting-v${VERSION}.zip"
          unzip -t "$ARCHIVE" >/dev/null
          ACTUAL="$(unzip -Z -1 "$ARCHIVE" | grep -E '^gathering-crafting/icons/(illustrated|handpainted)/.*[.]webp$' | wc -l | tr -d ' ')"
          test "$ACTUAL" -ge 224 || { echo "Expected at least 224 bundled item WebP artworks, found $ACTUAL"; exit 1; }
          # Check extracted ZIP *bytes*, not just source paths or file counts.
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          unzip -q "$ARCHIVE" -d "$TEMP_DIR"
          node artwork/check_preview_payload.cjs "$TEMP_DIR/gathering-crafting"
          node "$TEMP_DIR/gathering-crafting/tests/artwork.cjs"
          echo "Validated all 224 reviewed WebP SHA-256 digests in the installable archive"
      - name: Publish zip
        if: github.event_name == 'push'
        run: |
          VERSION="$(node -p "require('./module.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/gathering-crafting-v${VERSION}.zip"
          if ! git diff --cached --quiet; then
            git commit -m "build: package Gathering & Crafting v${VERSION}"
            git push
          fi
