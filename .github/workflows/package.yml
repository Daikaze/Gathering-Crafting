name: Package module
on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack original fantasy item artwork
        run: |
          for bundle in icons/illustrated-assets/*.zip; do unzip -q -o "$bundle" -d .; done
      - name: Audit all item artwork and module regression tests
        run: |
          node tests/artwork.cjs
          node tests/smoke.cjs
      - name: Package Foundry module
        run: |
          VERSION="$(node -p "require('./module.json').version")"
          mkdir -p dist staging/gathering-crafting
          rsync -a --exclude=.git --exclude=.github --exclude=dist --exclude=staging --exclude=illustrated-assets ./ staging/gathering-crafting/
          (cd staging && zip -q -r "../dist/gathering-crafting-v${VERSION}.zip" gathering-crafting)
      - name: Validate installable archive
        run: |
          VERSION="$(node -p "require('./module.json').version")"
          ARCHIVE="dist/gathering-crafting-v${VERSION}.zip"
          unzip -t "$ARCHIVE" >/dev/null
          ACTUAL="$(unzip -Z -1 "$ARCHIVE" | grep -E '^gathering-crafting/icons/(illustrated|handpainted)/.*[.]webp$' | wc -l | tr -d ' ')"
          test "$ACTUAL" -ge 224 || { echo "Expected at least 224 bundled item WebP artworks, found $ACTUAL"; exit 1; }
          node staging/gathering-crafting/tests/artwork.cjs
          echo "Validated $ACTUAL bundled WebP assets; all 224 catalogue references resolve in the packaged module"
      - name: Publish zip
        if: github.event_name == 'push'
        run: |
          VERSION="$(node -p "require('./module.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/gathering-crafting-v${VERSION}.zip"
          if ! git diff --cached --quiet; then
            git commit -m "build: package Gathering & Crafting v${VERSION}"
            git push
          fi
